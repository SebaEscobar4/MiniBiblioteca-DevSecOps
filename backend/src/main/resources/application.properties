spring.application.name=minibiblioteca-backend
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# ============================================================
# Observabilidad (EP3)
# ============================================================
# Endpoints de Actuator expuestos por HTTP:
#   /actuator/health      -> disponibilidad (usado por Docker y Kubernetes)
#   /actuator/info        -> versión desplegada (commit)
#   /actuator/prometheus  -> métricas para Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
# /actuator/health/liveness y /actuator/health/readiness para las probes de Kubernetes.
management.endpoint.health.probes.enabled=true
# Todas las métricas llevan la etiqueta application="minibiblioteca-backend".
management.metrics.tags.application=${spring.application.name}
# Histograma de tiempos de respuesta: permite calcular el percentil 95 en Grafana.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Versión desplegada: el Dockerfile define APP_VERSION con el SHA del commit.
app.version=${APP_VERSION:local}
info.app.version=${app.version}
management.info.env.enabled=true

# Logs estructurados en JSON (formato ECS): Loki/Promtail o CloudWatch pueden
# filtrar por nivel, logger o mensaje sin parsear texto libre.
logging.structured.format.console=ecs

# Endpoint de diagnóstico que genera un error 500 controlado, para demostrar
# que los errores se registran en métricas, logs y dashboard.
app.diagnostico.habilitado=true
