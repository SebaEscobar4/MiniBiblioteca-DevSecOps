# ============================================================
# PROMETHEUS - ENTORNO DOCKER COMPOSE
# ============================================================
# Qué recolecta (cada 15 s):
#   backend      -> /actuator/prometheus de TODAS las réplicas (descubiertas por DNS)
#   blackbox     -> disponibilidad vista "desde afuera" (frontend y API)
#   pushgateway  -> métricas que publica el pipeline CI/CD (cobertura, pruebas,
#                   tiempo de despliegue)
# ============================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # DNS de Docker: "backend" responde con la IP de cada réplica, así
  # Prometheus mide todas aunque se escale con --scale backend=N.
  - job_name: backend
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 8080
        refresh_interval: 15s

  # Sondas de disponibilidad: blackbox hace la petición HTTP y reporta
  # probe_success (1 = responde 2xx, 0 = caído) y el tiempo de respuesta.
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://frontend:8080/healthz
          - http://frontend:8080/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # honor_labels: se respetan las etiquetas que envía el pipeline (job, run).
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
