# DNS interno de Docker: Nginx vuelve a consultar cada 10 s cuántas
# réplicas de "backend" existen, así detecta las que se agregan o quitan
# con "docker compose up --scale" sin reiniciar el frontend.
resolver 127.0.0.11 valid=10s ipv6=off;

# Grupo de réplicas del backend. Nginx reparte las peticiones entre ellas
# (round-robin) y deja de enviar tráfico a la que falle.
upstream backend_pool {
    zone backend_pool 64k;
    server backend:8080 resolve max_fails=2 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # El navegador llama /api y Nginx lo reenvía al grupo de réplicas.
    location /api/ {
        proxy_pass http://backend_pool/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Red interna: si una réplica no conecta en 2 s, está caída.
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        # Si una réplica no responde, la petición se reintenta en otra:
        # el usuario no ve el error.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;

        # Muestra qué réplica atendió (útil para comprobar el balanceo).
        add_header X-Backend-Replica $upstream_addr always;
    }
}
